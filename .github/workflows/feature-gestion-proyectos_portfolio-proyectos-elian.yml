
# Docs for the Azure Web Apps Deploy action:
# https://github.com/Azure/webapps-deploy
#
# More GitHub Actions for Azure:
# https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - portfolio-proyectos-elian

on:
  push:
    branches:
      - feature/gestion-proyectos
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: ./web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: ./web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build

      - name: Run tests if present
        run: npm run test --if-present

      - name: Verify deployment files
        run: |
          test -f package.json
          test -d .next
          test -f node_modules/.bin/next
          echo "package.json encontrado"
          echo ".next encontrado"
          echo "node_modules/.bin/next encontrado"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ./web
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: web

      - name: Verify downloaded artifact
        run: |
          test -f web/package.json
          test -d web/.next
          test -f web/node_modules/.bin/next
          echo "Artifact descargado correctamente"
          echo ".next está incluido"
          echo "node_modules/.bin/next está incluido"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_7662B65BC39A4C5F96BE9CD8E7E6D953 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_661244051ADA4EA0856DF37F32F24A4A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_819F6F80D62B44E4A99BE895F2B7AC77 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: portfolio-proyectos-elian
          slot-name: Production
          package: web
